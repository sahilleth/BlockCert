# Railway config for @blockcert/frontend
# Dashboard: Settings → Root Directory = (empty / repo root)
#            Settings → Config-as-code → railway.frontend.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.frontend"
watchPatterns = ["frontend/**", "package.json", "package-lock.json"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
