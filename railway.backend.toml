# Railway config for @blockcert/backend
# Dashboard: Settings → Root Directory = (empty / repo root)
#            Settings → Config-as-code → railway.backend.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.backend"
watchPatterns = ["backend/**", "scripts/railway-start-backend.mjs", "package.json", "package-lock.json"]

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
